<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <title>100만 건에서 조회 한 번에 걸리는 시간: 인덱스 사용과 전체 탐색 비교</title>
  <rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="#ffffff" stroke="#d8dee6"/>

  <text x="36" y="48" font-size="21" font-weight="700" fill="#101828">id로 찾으면 0.002 ms, 이름으로 찾으면 18 ms</text>
  <text x="36" y="74" font-size="14" fill="#5b6675">100만 건 테이블에서 조회 한 번의 평균 시간 · 가로축은 로그 눈금 (한 칸이 10배)</text>

  <!-- 눈금: 0.001ms(x=250) ~ 100ms(x=800), 한 칸 110px -->
  <g stroke="#e6eaf0" stroke-width="1">
    <line x1="250" y1="104" x2="250" y2="318"/>
    <line x1="360" y1="104" x2="360" y2="318"/>
    <line x1="470" y1="104" x2="470" y2="318"/>
    <line x1="580" y1="104" x2="580" y2="318"/>
    <line x1="690" y1="104" x2="690" y2="318"/>
    <line x1="800" y1="104" x2="800" y2="318"/>
  </g>
  <g font-size="12" fill="#7a8494" text-anchor="middle">
    <text x="250" y="338">0.001</text>
    <text x="360" y="338">0.01</text>
    <text x="470" y="338">0.1</text>
    <text x="580" y="338">1</text>
    <text x="690" y="338">10</text>
    <text x="800" y="338">100 ms</text>
  </g>

  <!-- 막대: x = 250 + (log10(ms) + 3) * 110 -->
  <g font-size="14">
    <text x="234" y="130" text-anchor="end" font-weight="600" fill="#101828">WHERE id = ?</text>
    <text x="234" y="147" text-anchor="end" font-size="12" fill="#1f5fd6">INDEX SCAN</text>
    <rect x="250" y="116" width="33" height="30" rx="4" fill="#2563eb"/>
    <text x="293" y="137" font-weight="700" fill="#101828">0.0020 ms</text>

    <text x="234" y="182" text-anchor="end" font-weight="600" fill="#101828">WHERE id &gt; N-1000</text>
    <text x="234" y="199" text-anchor="end" font-size="12" fill="#1f5fd6">INDEX RANGE SCAN · 1,000행</text>
    <rect x="250" y="168" width="265" height="30" rx="4" fill="#2563eb"/>
    <text x="525" y="189" font-weight="700" fill="#101828">0.26 ms</text>

    <text x="234" y="234" text-anchor="end" font-weight="600" fill="#101828">WHERE email = ?</text>
    <text x="234" y="251" text-anchor="end" font-size="12" fill="#6b7280">FULL SCAN</text>
    <rect x="250" y="220" width="468" height="30" rx="4" fill="#9aa4b2"/>
    <text x="728" y="241" font-weight="700" fill="#101828">17.9 ms</text>

    <text x="234" y="286" text-anchor="end" font-weight="600" fill="#101828">WHERE name = ?</text>
    <text x="234" y="303" text-anchor="end" font-size="12" fill="#6b7280">FULL SCAN</text>
    <rect x="250" y="272" width="469" height="30" rx="4" fill="#9aa4b2"/>
    <text x="729" y="293" font-weight="700" fill="#101828">18.5 ms</text>
  </g>

  <rect x="36" y="356" width="12" height="12" rx="3" fill="#2563eb"/>
  <text x="54" y="367" font-size="12" fill="#5b6675">B+ 트리 인덱스 사용</text>
  <rect x="186" y="356" width="12" height="12" rx="3" fill="#9aa4b2"/>
  <text x="204" y="367" font-size="12" fill="#5b6675">전체 탐색</text>
  <text x="844" y="367" font-size="12" fill="#7a8494" text-anchor="end">make bench · 2026-11-17 · WSL2 Ubuntu 22.04, gcc 11.4, 12코어 · 페이지 캐시에 올라온 상태</text>
</svg>
