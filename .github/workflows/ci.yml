# 🟦 공통 — 세션 밖의 게이트: Claude 없이 만든 커밋, 훅을 끈 세션의 커밋도 같은 check.sh로 검사한다.
# main에는 이 체크(check)를 병합 필수 조건으로 건다 (GitHub Settings → Rules → Rulesets).
# pull_request 이벤트는 fork에서 온 PR에 비밀 값(secrets)을 주지 않는다. pull_request_target으로 바꾸지 말 것.
name: ci
on:
  pull_request:
    branches: [main, dev]
  push:
    # 통합 브랜치(dev)는 PR 없이 병합하므로 push에서도 검사한다.
    branches: [main, dev]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # 🟩 특화: gcc·make·curl은 러너에 이미 있다.
      - run: bash .claude/check.sh
      # 🟩 특화: 메모리 오류는 로컬 게이트에서 빼고 CI에서만 본다 (시간이 더 걸림).
      - run: make asan
